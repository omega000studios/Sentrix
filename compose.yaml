services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sellershield
      POSTGRES_USER: sellershield
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellershield"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
