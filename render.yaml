databases:
  - name: sentrix-db
    region: oregon
    plan: basic-256mb
    databaseName: sentrix
    user: sentrix
services:
  - type: web
    name: sentrix-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log --log-level info
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        fromDatabase:
          name: sentrix-db
          property: connectionString
      - key: MERCHANT_USERNAME
        sync: false
      - key: MERCHANT_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
